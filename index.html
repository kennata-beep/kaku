<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九九れんしゅう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec; --card:#ffffff; --ink:#3a2e2a; --sub:#8a7a70;
    --main:#ff7a45; --main-d:#e45f2b; --ok:#2fae6b; --ng:#e5484d;
    --line:#f0e2cf; --chip:#fff1de; --blue:#3b82f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;
    display:flex;justify-content:center;padding:16px}
  .app{width:100%;max-width:520px}
  h1{font-size:28px;text-align:center;margin:8px 0 16px;letter-spacing:.05em}
  h1 span{color:var(--main)}
  .card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 4px 0 var(--line);margin-bottom:16px}
  .label{font-weight:800;font-size:18px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .mini{font-size:14px;font-weight:700;border:none;background:var(--chip);color:var(--ink);
    border-radius:999px;padding:6px 12px;cursor:pointer;margin-left:6px;font-family:inherit}
  .dans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .dan{font-family:inherit;font-size:22px;font-weight:800;padding:14px 0;border-radius:16px;
    border:3px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;transition:.12s}
  .dan.on{background:var(--main);border-color:var(--main-d);color:#fff;box-shadow:0 3px 0 var(--main-d)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font-family:inherit;font-size:18px;font-weight:700;padding:10px 16px;border-radius:14px;
    border:3px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
  .opt.on{border-color:var(--blue);color:var(--blue);background:#eef4ff}
  .big{display:block;width:100%;font-family:inherit;font-size:26px;font-weight:800;padding:18px;
    border:none;border-radius:20px;background:var(--main);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--main-d)}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--main-d)}
  .big:disabled{background:#ddd;box-shadow:0 5px 0 #c8c8c8;cursor:default}
  .big.sec{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
  .note{color:var(--sub);font-size:14px;text-align:center;margin:8px 0 0}
  .hidden{display:none!important}

  /* quiz */
  .top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--sub);margin-bottom:8px}
  .bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--main);width:0;transition:width .3s}
  .q{text-align:center;padding:28px 10px 18px;position:relative}
  .yomi{font-size:clamp(26px,8vw,36px);font-weight:800;color:var(--main);letter-spacing:.12em;margin-bottom:10px}
  .yomi .kotae{color:var(--sub)}
  .expr{font-size:clamp(44px,14vw,64px);font-weight:800;letter-spacing:.04em;line-height:1}
  .ans{display:inline-block;min-width:1.6em;border-bottom:6px solid var(--main);color:var(--blue)}
  .feedback{height:44px;margin-top:14px;font-size:24px;font-weight:800}
  .feedback.ok{color:var(--ok)} .feedback.ng{color:var(--ng)}
  .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:200px;font-weight:800;pointer-events:none;opacity:0}
  .mark.show{animation:pop .6s ease-out}
  @keyframes pop{0%{opacity:.0;transform:scale(.5)}30%{opacity:.35;transform:scale(1.05)}100%{opacity:0;transform:scale(1)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key{font-family:inherit;font-size:30px;font-weight:800;padding:14px 0;border-radius:18px;border:none;
    background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .key.del{font-size:20px;color:var(--sub)}
  .key.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 #23864f;font-size:22px}
  .mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;
    font-family:inherit;font-size:20px;font-weight:800;padding:14px;border-radius:18px;border:3px solid var(--blue);
    background:#fff;color:var(--blue);cursor:pointer}
  .mic.on{background:var(--blue);color:#fff;animation:pulse 1.4s infinite}
  .mic:disabled{border-color:#ccc;color:#aaa;animation:none;background:#f6f6f6}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 10px rgba(59,130,246,0)}}
  .voiceMsg{text-align:center;color:var(--sub);font-size:14px;min-height:20px;margin:6px 0 0}
  .quit{font-family:inherit;background:none;border:none;color:var(--sub);font-size:15px;cursor:pointer;text-decoration:underline}

  /* result */
  .score{text-align:center}
  .score .num{font-size:72px;font-weight:800;color:var(--main);line-height:1.1}
  .score .num small{font-size:32px;color:var(--sub)}
  .score .msg{font-size:22px;font-weight:800;margin:6px 0}
  .score .time{color:var(--sub);font-weight:700}
  .miss{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .miss li{background:#fff2f2;border-radius:12px;padding:10px;font-size:20px;font-weight:700;text-align:center}
  .miss li b{color:var(--ok)}
  .miss li s{color:var(--ng);font-size:15px;margin-left:4px}
  .stack{display:grid;gap:12px}
  .stars{font-size:40px;letter-spacing:4px}

  /* ごほうびキャラ「ぴよまる」 */
  .chara{position:relative;text-align:center;margin:4px 0 8px;overflow:hidden;border-radius:20px}
  .chara svg{width:170px;height:170px;display:block;margin:0 auto}
  .bubble{display:inline-block;background:#fff3c4;border:3px solid #ffd54a;border-radius:18px;
    padding:8px 14px;font-size:17px;font-weight:800;margin-bottom:4px;position:relative}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:#ffd54a}
  .chara.jump svg{animation:jump .9s ease-in-out infinite}
  .chara.wave svg{animation:sway 1.6s ease-in-out infinite;transform-origin:50% 90%}
  .chara.wave .wingR{animation:flap .5s ease-in-out infinite alternate;transform-origin:130px 100px}
  .chara.jump .wingR{animation:flap .25s ease-in-out infinite alternate} .chara.jump .wingL{animation:flapL .25s ease-in-out infinite alternate}
  .wingR{transform-origin:130px 100px} .wingL{transform-origin:50px 100px}
  .crown{display:none} .chara.jump .crown{display:inline}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-22px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.05,.95)}}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes flap{from{transform:rotate(0)}to{transform:rotate(-25deg)}}
  @keyframes flapL{from{transform:rotate(0)}to{transform:rotate(25deg)}}
  .confetti{position:absolute;inset:0;pointer-events:none}
  .confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(260px) rotate(540deg)}}
</style>
</head>
<body>
<div class="app">

  <!-- せってい -->
  <section id="setup">
    <h1>くく <span>れんしゅう</span></h1>
    <div class="card">
      <div class="label">だんを えらぼう
        <span><button class="mini" id="allOn">ぜんぶ</button><button class="mini" id="allOff">けす</button></span>
      </div>
      <div class="dans" id="dans"></div>
    </div>
    <div class="card">
      <div class="label">もんだいの かず</div>
      <div class="opts" id="counts"></div>
    </div>
    <div class="card">
      <div class="label">でかた</div>
      <div class="opts" id="orders"></div>
    </div>
    <button class="big" id="start">スタート！</button>
    <p class="note" id="info"></p>
  </section>

  <!-- もんだい -->
  <section id="quiz" class="hidden">
    <div class="top"><span id="prog">1 / 10</span><span id="timer">0びょう</span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="card q">
      <div class="yomi" id="yomi"></div>
      <div class="expr"><span id="qa">3</span> × <span id="qb">4</span> = <span class="ans" id="ans">&nbsp;</span></div>
      <div class="feedback" id="fb"></div>
      <div class="mark" id="mark"></div>
    </div>
    <div class="pad" id="pad"></div>
    <button class="mic" id="mic">🎤 こえで こたえる</button>
    <p class="voiceMsg" id="voiceMsg"></p>
    <p class="note"><button class="quit" id="quit">やめる</button></p>
  </section>

  <!-- けっか -->
  <section id="result" class="hidden">
    <div class="card score">
      <div class="chara hidden" id="chara">
        <div class="confetti" id="confetti"></div>
        <div class="bubble" id="bubble"></div>
        <svg viewBox="0 0 180 180" aria-label="ぴよまる">
          <!-- おうかん（ぜんもんせいかいのとき） -->
          <g class="crown">
            <path d="M66 40 L72 18 L82 32 L90 14 L98 32 L108 18 L114 40 Z" fill="#ffc83d" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="90" cy="14" r="4" fill="#ff6b8a"/><circle cx="72" cy="18" r="3" fill="#5ec8ff"/><circle cx="108" cy="18" r="3" fill="#5ec8ff"/>
          </g>
          <!-- あたまの はね -->
          <path d="M88 44 C82 30 92 26 92 36 C96 28 104 32 96 44" fill="#ffd54a" stroke="#e8b400" stroke-width="3" stroke-linecap="round"/>
          <!-- あし -->
          <path d="M74 158 l-6 10 M74 158 l0 11 M74 158 l6 10" stroke="#ff9a3c" stroke-width="5" stroke-linecap="round"/>
          <path d="M106 158 l-6 10 M106 158 l0 11 M106 158 l6 10" stroke="#ff9a3c" stroke-width="5" stroke-linecap="round"/>
          <!-- からだ -->
          <ellipse cx="90" cy="104" rx="58" ry="58" fill="#ffe066" stroke="#e8b400" stroke-width="4"/>
          <ellipse cx="90" cy="124" rx="34" ry="28" fill="#fff4b8"/>
          <!-- はね -->
          <g class="wingL"><ellipse cx="40" cy="112" rx="13" ry="22" fill="#ffd23f" stroke="#e8b400" stroke-width="3" transform="rotate(20 40 112)"/></g>
          <g class="wingR"><ellipse cx="140" cy="112" rx="13" ry="22" fill="#ffd23f" stroke="#e8b400" stroke-width="3" transform="rotate(-20 140 112)"/></g>
          <!-- め（にっこり） -->
          <path d="M62 92 q8 -10 16 0" stroke="#3a2e2a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M102 92 q8 -10 16 0" stroke="#3a2e2a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- ほっぺ -->
          <ellipse cx="58" cy="108" rx="9" ry="6" fill="#ff9fb2" opacity=".85"/>
          <ellipse cx="122" cy="108" rx="9" ry="6" fill="#ff9fb2" opacity=".85"/>
          <!-- くちばし -->
          <path d="M82 102 L98 102 L90 114 Z" fill="#ff9a3c" stroke="#e57a1c" stroke-width="2" stroke-linejoin="round"/>
          <!-- おなかの「九九」 -->
          <text x="90" y="140" text-anchor="middle" font-size="18" font-weight="800" fill="#e8b400" font-family="inherit">九九</text>
        </svg>
      </div>
      <div class="stars" id="stars"></div>
      <div class="num"><span id="rScore">0</span><small> / <span id="rTotal">0</span></small></div>
      <div class="msg" id="rMsg"></div>
      <div class="time" id="rTime"></div>
    </div>
    <div class="card" id="missCard">
      <div class="label">まちがえた もんだい</div>
      <ul class="miss" id="missList"></ul>
    </div>
    <div class="stack">
      <button class="big" id="retryMiss">まちがえた もんだいを もういちど</button>
      <button class="big" id="again">おなじ せっていで もういちど</button>
      <button class="big sec" id="back">せっていに もどる</button>
    </div>
  </section>

</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const COUNTS = [{v:10,t:"10もん"},{v:20,t:"20もん"},{v:30,t:"30もん"},{v:0,t:"ぜんぶ"}];
  const ORDERS = [{v:"random",t:"バラバラ"},{v:"seq",t:"じゅんばん"}];

  // せっていの読み込み（使えない環境でも動くように）
  let settings = {dans:[2,3,4,5,6,7,8,9], count:10, order:"random"};
  try { const s = JSON.parse(localStorage.getItem("kuku-settings")); if (s && Array.isArray(s.dans)) settings = Object.assign(settings, s); } catch(e){}
  const save = () => { try { localStorage.setItem("kuku-settings", JSON.stringify(settings)); } catch(e){} };

  // ---- せってい画面 ----
  const dansEl = $("dans");
  for (let d = 1; d <= 9; d++) {
    const b = document.createElement("button");
    b.className = "dan"; b.textContent = d + "のだん"; b.dataset.d = d;
    b.onclick = () => {
      const i = settings.dans.indexOf(d);
      i >= 0 ? settings.dans.splice(i,1) : settings.dans.push(d);
      renderSetup(); save();
    };
    dansEl.appendChild(b);
  }
  const makeOpts = (el, list, key) => list.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.t; b.dataset.v = o.v;
    b.onclick = () => { settings[key] = o.v; renderSetup(); save(); };
    el.appendChild(b);
  });
  makeOpts($("counts"), COUNTS, "count");
  makeOpts($("orders"), ORDERS, "order");
  $("allOn").onclick = () => { settings.dans = [1,2,3,4,5,6,7,8,9]; renderSetup(); save(); };
  $("allOff").onclick = () => { settings.dans = []; renderSetup(); save(); };

  function renderSetup(){
    dansEl.querySelectorAll(".dan").forEach(b => b.classList.toggle("on", settings.dans.includes(+b.dataset.d)));
    $("counts").querySelectorAll(".opt").forEach(b => b.classList.toggle("on", +b.dataset.v === settings.count));
    $("orders").querySelectorAll(".opt").forEach(b => b.classList.toggle("on", b.dataset.v === settings.order));
    const n = settings.dans.length;
    $("start").disabled = n === 0;
    $("info").textContent = n === 0 ? "だんを 1つ いじょう えらんでね"
      : "えらんだ だん：" + [...settings.dans].sort((a,b)=>a-b).join("・") + "（" + n*9 + "もんから しゅつだい）";
  }
  renderSetup();

  // ---- 九九のとなえかた [問題の部分, 答えの部分] ----
  const YOMI = {
    1:[["いんいち","がいち"],["いんに","がに"],["いんさん","がさん"],["いんし","がし"],["いんご","がご"],["いんろく","がろく"],["いんしち","がしち"],["いんはち","がはち"],["いんく","がく"]],
    2:[["にいち","がに"],["ににん","がし"],["にさん","がろく"],["にし","がはち"],["にご","じゅう"],["にろく","じゅうに"],["にしち","じゅうし"],["にはち","じゅうろく"],["にく","じゅうはち"]],
    3:[["さんいち","がさん"],["さんに","がろく"],["さざん","がく"],["さんし","じゅうに"],["さんご","じゅうご"],["さぶろく","じゅうはち"],["さんしち","にじゅういち"],["さんぱ","にじゅうし"],["さんく","にじゅうしち"]],
    4:[["しいち","がし"],["しに","がはち"],["しさん","じゅうに"],["しし","じゅうろく"],["しご","にじゅう"],["しろく","にじゅうし"],["ししち","にじゅうはち"],["しは","さんじゅうに"],["しく","さんじゅうろく"]],
    5:[["ごいち","がご"],["ごに","じゅう"],["ごさん","じゅうご"],["ごし","にじゅう"],["ごご","にじゅうご"],["ごろく","さんじゅう"],["ごしち","さんじゅうご"],["ごは","しじゅう"],["ごっく","しじゅうご"]],
    6:[["ろくいち","がろく"],["ろくに","じゅうに"],["ろくさん","じゅうはち"],["ろくし","にじゅうし"],["ろくご","さんじゅう"],["ろくろく","さんじゅうろく"],["ろくしち","しじゅうに"],["ろくは","しじゅうはち"],["ろっく","ごじゅうし"]],
    7:[["しちいち","がしち"],["しちに","じゅうし"],["しちさん","にじゅういち"],["しちし","にじゅうはち"],["しちご","さんじゅうご"],["しちろく","しじゅうに"],["しちしち","しじゅうく"],["しちは","ごじゅうろく"],["しちく","ろくじゅうさん"]],
    8:[["はちいち","がはち"],["はちに","じゅうろく"],["はちさん","にじゅうし"],["はちし","さんじゅうに"],["はちご","しじゅう"],["はちろく","しじゅうはち"],["はちしち","ごじゅうろく"],["はっぱ","ろくじゅうし"],["はっく","しちじゅうに"]],
    9:[["くいち","がく"],["くに","じゅうはち"],["くさん","にじゅうしち"],["くし","さんじゅうろく"],["くご","しじゅうご"],["くろく","ごじゅうし"],["くしち","ろくじゅうさん"],["くは","しちじゅうに"],["くく","はちじゅういち"]]
  };
  const yomi = (a,b) => YOMI[a][b-1];

  // ---- もんだい作り ----
  const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  function buildQuestions(){
    const dans = [...settings.dans].sort((a,b)=>a-b);
    const pool = [];
    dans.forEach(a => { for (let b=1;b<=9;b++) pool.push([a,b]); });
    if (settings.order === "seq") {
      const n = settings.count || pool.length, out = [];
      while (out.length < n) out.push(pool[out.length % pool.length]);
      return out;
    }
    const n = settings.count || pool.length, out = [];
    while (out.length < n) {
      let batch = shuffle(pool.slice());
      // つなぎめで同じ問題が続かないように
      if (out.length && batch.length > 1 && batch[0] === out[out.length-1]) batch.push(batch.shift());
      out.push(...batch);
    }
    return out.slice(0, n);
  }

  // ---- 出題 ----
  let qs = [], idx = 0, input = "", correct = 0, misses = [], startTime = 0, tick = null, locked = false, lastQs = [];
  const show = id => ["setup","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s !== id));

  const pad = $("pad");
  ["7","8","9","4","5","6","1","2","3","del","0","go"].forEach(k => {
    const b = document.createElement("button");
    b.className = "key" + (k==="del"?" del":k==="go"?" go":"");
    b.textContent = k==="del" ? "けす" : k==="go" ? "こたえる" : k;
    b.onclick = () => press(k);
    pad.appendChild(b);
  });

  function startQuiz(list){
    qs = list; lastQs = list.slice(); idx = 0; correct = 0; misses = [];
    show("quiz"); startTime = Date.now();
    clearInterval(tick);
    tick = setInterval(() => $("timer").textContent = fmt(Date.now()-startTime), 500);
    $("timer").textContent = fmt(0);
    nextQ();
  }
  function nextQ(){
    locked = false; input = "";
    const [a,b] = qs[idx];
    $("qa").textContent = a; $("qb").textContent = b;
    $("yomi").textContent = yomi(a,b)[0];
    $("ans").innerHTML = "&nbsp;"; $("ans").style.color = "";
    $("fb").textContent = ""; $("fb").className = "feedback";
    $("prog").textContent = (idx+1) + " / " + qs.length;
    $("barFill").style.width = (idx/qs.length*100) + "%";
    if (voiceOn) listen();
  }
  function press(k){
    if (locked) return;
    if (k === "del") input = input.slice(0,-1);
    else if (k === "go") { if (input !== "") judge(); return; }
    else if (input.length < 2) input += k;
    $("ans").innerHTML = input || "&nbsp;";
  }
  function judge(){
    locked = true;
    stopListen();
    const [a,b] = qs[idx], right = a*b, val = parseInt(input,10);
    const ok = val === right, mark = $("mark"), fb = $("fb");
    mark.textContent = ok ? "○" : "×";
    mark.style.color = ok ? "var(--ok)" : "var(--ng)";
    mark.classList.remove("show"); void mark.offsetWidth; mark.classList.add("show");
    $("yomi").innerHTML = yomi(a,b)[0] + " <span class='kotae'>" + yomi(a,b)[1] + "</span>";
    if (ok) { correct++; fb.textContent = "せいかい！"; fb.className = "feedback ok"; $("ans").style.color = "var(--ok)"; }
    else {
      misses.push({a,b,given:val});
      fb.textContent = "こたえは " + right; fb.className = "feedback ng"; $("ans").style.color = "var(--ng)";
    }
    setTimeout(() => {
      idx++;
      if (idx < qs.length) nextQ(); else finish();
    }, ok ? 900 : 1800);
  }
  function finish(){
    clearInterval(tick);
    stopListen();
    $("barFill").style.width = "100%";
    const total = qs.length, ms = Date.now()-startTime, rate = correct/total;
    $("rScore").textContent = correct; $("rTotal").textContent = total;
    $("rTime").textContent = "じかん：" + fmt(ms) + "（1もん あたり " + (ms/1000/total).toFixed(1) + "びょう）";
    $("stars").textContent = rate === 1 ? "★★★" : rate >= .8 ? "★★☆" : rate >= .5 ? "★☆☆" : "☆☆☆";
    $("rMsg").textContent = rate === 1 ? "ぜんもん せいかい！すごい！" : rate >= .8 ? "よくできました！" : rate >= .5 ? "もうすこし！" : "れんしゅう しよう！";
    showChara(rate);
    const list = $("missList"); list.innerHTML = "";
    // 同じ問題は1回だけ表示
    const seen = new Set();
    misses.forEach(m => {
      const key = m.a+"x"+m.b; if (seen.has(key)) return; seen.add(key);
      const li = document.createElement("li");
      li.innerHTML = m.a + " × " + m.b + " = <b>" + (m.a*m.b) + "</b><s>" + m.given + "</s>";
      list.appendChild(li);
    });
    $("missCard").classList.toggle("hidden", misses.length === 0);
    $("retryMiss").classList.toggle("hidden", misses.length === 0);
    show("result");
  }
  // 8わり いじょうで ぴよまるが とうじょう、ぜんもんせいかいは おうかん＋かみふぶき
  function showChara(rate){
    const c = $("chara"), cf = $("confetti");
    cf.innerHTML = ""; c.className = "chara hidden";
    if (rate < 0.8) return;
    const perfect = rate === 1;
    const words = perfect
      ? ["ぜんもん せいかい！てんさい！","パーフェクト！すごすぎる〜！","くくマスターだね！"]
      : ["よくがんばったね！","すごい！あと ちょっとで まんてん！","その ちょうし！"];
    $("bubble").textContent = words[Math.floor(Math.random()*words.length)];
    c.className = "chara " + (perfect ? "jump" : "wave");
    if (perfect) {
      const colors = ["#ff7a45","#ffd54a","#5ec8ff","#ff6b8a","#2fae6b","#a77bff"];
      for (let i = 0; i < 28; i++) {
        const p = document.createElement("i");
        p.style.left = Math.random()*100 + "%";
        p.style.background = colors[i % colors.length];
        p.style.animationDuration = (1.8 + Math.random()*1.6) + "s";
        p.style.animationDelay = (-Math.random()*3) + "s";
        cf.appendChild(p);
      }
    }
  }
  const fmt = ms => { const s = Math.floor(ms/1000), m = Math.floor(s/60); return m ? m+"ふん"+(s%60)+"びょう" : s+"びょう"; };

  $("start").onclick = () => startQuiz(buildQuestions());
  $("quit").onclick = () => { clearInterval(tick); stopListen(); show("setup"); };

  // ---- こえで こたえる（Web Speech API） ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, voiceOn = false, listening = false;
  const micBtn = $("mic"), vmsg = t => $("voiceMsg").textContent = t;

  // 「しじゅうご」「五十六」「56」などを数字にする
  function toNumber(text){
    let s = text.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\s|、|。/g,"");
    // 「さんく にじゅうしち」のように九九ごと言ったときは、問題の部分をとりのぞく
    if (qs[idx]) { const q = yomi(qs[idx][0], qs[idx][1])[0]; if (s.startsWith(q)) s = s.slice(q.length); }
    if (s.includes("が")) s = s.slice(s.lastIndexOf("が")+1);
    const m = s.match(/\d+/);
    if (m) return parseInt(m[0],10);
    const kana = [["きゅう","9"],["じゅう","十"],["しち","7"],["よん","4"],["なな","7"],["はち","8"],["はっ","8"],
      ["ろく","6"],["ろっ","6"],["さん","3"],["いち","1"],["いっ","1"],["ぜろ","0"],["れい","0"],["に","2"],["ご","5"],["し","4"],["く","9"]];
    kana.forEach(([k,v]) => s = s.split(k).join(v));
    s = s.replace(/[〇零一二三四五六七八九]/g, c => "〇一二三四五六七八九".indexOf(c) >= 0 ? "〇一二三四五六七八九".indexOf(c) : (c==="零"?0:c));
    s = s.replace(/[^0-9十]/g,"");
    if (!s) return null;
    if (s.includes("十")) {
      const [l, r] = s.split("十");
      const tens = l === "" ? 1 : parseInt(l.slice(-1),10);
      const ones = r === "" ? 0 : parseInt(r[0],10);
      return tens*10 + ones;
    }
    return parseInt(s,10);
  }

  if (!SR) {
    micBtn.disabled = true;
    vmsg("このブラウザでは こえの にゅうりょくが つかえません（Chrome・Edge・Safari で つかえます）");
  } else {
    rec = new SR();
    rec.lang = "ja-JP"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 5;
    rec.onstart = () => { listening = true; vmsg("きいているよ… こたえを いってね"); };
    rec.onresult = e => {
      const r = e.results[e.results.length-1];
      let n = null;
      for (let i = 0; i < r.length && n === null; i++) n = toNumber(r[i].transcript);
      if (n !== null && !locked) { input = String(n).slice(0,2); $("ans").textContent = input; }
      if (r.isFinal && !locked) {
        if (n === null) vmsg("きこえなかったよ。もういちど いってね");
        else judge();
      }
    };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
        setVoice(false);
        vmsg("マイクが つかえません。マイクを きょかするか、ボタンで こたえてね");
      }
    };
    rec.onend = () => { listening = false; if (voiceOn && !locked && !$("quiz").classList.contains("hidden")) listen(); };
    micBtn.onclick = () => setVoice(!voiceOn);
  }
  function setVoice(on){
    voiceOn = on;
    micBtn.classList.toggle("on", on);
    micBtn.textContent = on ? "🎤 こえで こたえる：オン" : "🎤 こえで こたえる";
    if (on) { if (!locked) listen(); } else { stopListen(); vmsg(""); }
  }
  function listen(){ if (!rec || listening) return; try { rec.start(); } catch(e){} }
  function stopListen(){ if (rec && listening) { try { rec.abort(); } catch(e){} } }
  $("again").onclick = () => startQuiz(buildQuestions());
  $("back").onclick = () => show("setup");
  $("retryMiss").onclick = () => {
    const seen = new Set(), list = [];
    misses.forEach(m => { const k=m.a+"x"+m.b; if(!seen.has(k)){seen.add(k); list.push([m.a,m.b]);} });
    startQuiz(shuffle(list));
  };

  // キーボードでも答えられる
  document.addEventListener("keydown", e => {
    if ($("quiz").classList.contains("hidden")) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
    else if (e.key === "Enter") press("go");
  });
})();
</script>
</body>
</html>
